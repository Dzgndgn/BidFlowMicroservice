
services:
  bidflow-postgres:
    image: postgres:17
    container_name: bidflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bidflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: IdentityDb
    ports:
      - "5433:5432"
    volumes:
      - bidflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidflow -d IdentityDb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bidflow-postgres-data:
